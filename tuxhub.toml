# Integration with tuxhub (live interface, requires tuxhub 0.7.0 or newer).
# See https://github.com/SirSnolte/tuxhub
#
# The settings live in the tool's own background service, so tuxhub, the
# tool's window and the command line always show the same state. tuxhub
# starts the service when needed and talks to it over its live socket. The
# interface in ui/ is localized and runs both in tuxhub and in the window.
# The manifest only declares the actions and their default hotkeys.

id = "push-to-mute"
name = "Push-to-Mute"
version = "0.4.0"
description = "Mutes Discord, TeamSpeak and other voice chats while you talk in game with push-to-talk."
icon = "assets/icon.svg"

ui = "ui/index.html"

[run]
command = "tuxhub-push-to-mute"

[live]
command = "tuxhub-push-to-mute"
args = ["daemon"]

[uninstall]
command = "tuxhub-push-to-mute"
args = ["uninstall"]

[[actions]]
id = "toggle"
label = "Pause or resume muting"
